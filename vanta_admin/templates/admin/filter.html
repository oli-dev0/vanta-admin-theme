{% load i18n admin_theme %}
<details data-filter-title="{{ title }}" open>
  <summary>
    {% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}
  </summary>
  <select
    class="admin-filter-select"
    data-vanta-navigate="true"
    aria-label="{% blocktranslate with filter_title=title %}Filter by {{ filter_title }}{% endblocktranslate %}"
  >
  {% for choice in choices %}
    <option value="{{ choice.query_string|iriencode }}"{% if choice.selected %} selected{% endif %}>
      {{ choice.display|format_admin_facet_label }}
    </option>
  {% endfor %}
  </select>
</details>
